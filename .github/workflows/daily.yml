name: refresh-jobs
on:
  schedule: [{cron: "30 1 * * *"}]   # 07:00 IST daily
  workflow_dispatch:
permissions: {contents: write}
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python scrape.py
      - run: |
          git config user.name "jobs-bot" && git config user.email "bot@users.noreply.github.com"
          git add docs/jobs.json && (git diff --cached --quiet || git commit -m "refresh jobs") && git push
