<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevOps &amp; SRE roles</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f2;--ink:#161a20;--mute:#5d6570;--line:#d8dbd4;--card:#fff;--acc:#2446d6;--new:#b86a00}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--ink:#eceef1;--mute:#98a1ad;--line:#2b313a;--card:#1b2027;--acc:#7f9bff;--new:#f0a63a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 18px 80px}
h1{font:800 clamp(28px,5vw,44px)/1.05 "Bricolage Grotesque",sans-serif;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 22px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;display:flex;gap:8px;align-items:baseline}
.tab b{font:800 20px "Bricolage Grotesque",sans-serif}.tab[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
input[type=search]{flex:1 1 220px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
label{color:var(--mute);display:flex;gap:6px;align-items:center}
button{font:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.job{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:14px 0;border-top:1px solid var(--line)}
.job h2{font:600 17px/1.3 "Public Sans",sans-serif;margin:0}.job h2 a{color:inherit;text-decoration:none}.job h2 a:hover{color:var(--acc);text-decoration:underline}
.meta{color:var(--mute);font-size:13.5px}.new{color:var(--new);font-weight:600}
.act{display:flex;gap:8px;align-items:center}
.act button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px}
.act button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.empty{padding:40px 0;color:var(--mute)}
.q{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}
.q button{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 14px;font-weight:600}
@media(max-width:560px){.job{grid-template-columns:1fr}}
</style></head><body><main>
<h1>DevOps &amp; SRE roles</h1>
<p class="sub" id="sub">Loading…</p>
<div class="tabs" id="tabs"></div>
<div class="bar"><input type="search" id="q" placeholder="Search title or company" aria-label="Search">
<label><input type="checkbox" id="sen" checked> Senior signals only</label>
<label><input type="checkbox" id="hide" checked> Hide applied</label></div>
<div id="list"></div>
<div class="q"><span id="qc" class="meta"></span><button id="exp">Export approved queue</button></div>
</main><script>
const R={ALL:"All",SG:"Singapore",TH:"Thailand",MY:"Malaysia",AE:"Dubai / UAE","IN-REMOTE":"India remote","IN-PRODUCT":"India product cos",GLOBAL:"Global remote"};
const $=id=>document.getElementById(id);let jobs=[],reg="ALL",st={};
try{st=JSON.parse(localStorage.getItem("st")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("st",JSON.stringify(st))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fresh=j=>(Date.now()-new Date(j.first_seen))/864e5<=3;
function pool(){const q=$("q").value.toLowerCase();return jobs.filter(j=>(!$("sen").checked||j.senior)&&(!$("hide").checked||st[j.id]!=="applied")&&(!q||(j.title+j.company).toLowerCase().includes(q)))}
function render(){const p=pool(),n=k=>k==="ALL"?p.length:p.filter(j=>j.region===k).length;
$("tabs").innerHTML=Object.keys(R).map(k=>`<button class="tab" data-k="${k}" aria-pressed="${k===reg}"><b>${n(k)}</b>${R[k]}</button>`).join("");
const L=p.filter(j=>reg==="ALL"||j.region===reg);
$("list").innerHTML=L.length?L.map(j=>`<div class="job"><div><h2><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h2>
<div class="meta">${esc(j.company)} · ${esc(j.location)}${j.years?" · "+j.years:""} · ${j.source}${fresh(j)?' · <span class="new">new</span>':""}</div></div>
<div class="act"><button data-id="${j.id}" data-s="approved" aria-pressed="${st[j.id]==="approved"}">Approve</button>
<button data-id="${j.id}" data-s="applied" aria-pressed="${st[j.id]==="applied"}">Applied</button></div></div>`).join(""):`<div class="empty">No roles match. Clear the search or untick “Senior signals only”.</div>`;
$("qc").textContent=Object.values(st).filter(v=>v==="approved").length+" approved for auto-apply"}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
if(t.dataset.k){reg=t.dataset.k;render()}else if(t.dataset.id){st[t.dataset.id]=st[t.dataset.id]===t.dataset.s?"":t.dataset.s;save();render()}});
["q","sen","hide"].forEach(i=>$(i).addEventListener("input",render));
$("exp").onclick=()=>{const a=jobs.filter(j=>st[j.id]==="approved");const b=new Blob([JSON.stringify(a,null,1)],{type:"application/json"});
const l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="approved.json";l.click()};
fetch("jobs.json").then(r=>r.json()).then(d=>{jobs=d.jobs;$("sub").textContent=`${jobs.length} roles, refreshed ${new Date(d.updated).toLocaleString()}`;render()})
.catch(()=>$("sub").textContent="Couldn’t load jobs.json. Run the refresh workflow once.");
</script></body></html>
